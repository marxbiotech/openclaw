name: Marxbiotech Docker Release

on:
  push:
    tags: ["mb*"]

# Fork images use mb version tags. The matching fork npm lane lives in
# openclaw-npm-release.yml; upstream owns Docker Hub and its channel promotion.
concurrency:
  group: marxbiotech-docker-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE: ghcr.io/marxbiotech/openclaw

jobs:
  identity:
    if: github.repository == 'marxbiotech/openclaw'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      created: ${{ steps.identity.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate fork tag and source version
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(node scripts/marxbiotech-npm-release.mjs identity "$GITHUB_REF_NAME")"
          version="$(jq -er .sourceVersion <<< "$identity")"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object | select(.type == "commit") | .sha')" = "$GITHUB_SHA"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date --utc --date="$(git show -s --format=%cI HEAD)" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build:
    needs: identity
    environment: docker-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Build immutable architecture image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=marxbiotech-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=marxbiotech-release-${{ matrix.arch }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            OPENCLAW_BUILD_TIMESTAMP=${{ needs.identity.outputs.created }}
            OPENCLAW_DOCKER_BUILD_VERSION=${{ needs.identity.outputs.version }}
            OPENCLAW_EXTENSIONS=diagnostics-otel,codex
          labels: |
            org.opencontainers.image.source=https://github.com/marxbiotech/openclaw
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ needs.identity.outputs.created }}
          sbom: true
          provenance: mode=max
      - name: Verify runtime identity and public ACP backend
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node \
            -e RELEASE_VERSION -e GITHUB_SHA "$IMAGE@$DIGEST" \
            --input-type=module -e '
              import assert from "node:assert/strict";
              import { readFileSync } from "node:fs";
              import { execFileSync } from "node:child_process";
              import * as sdk from "openclaw/plugin-sdk/acp-backend";
              const read = (path) => JSON.parse(readFileSync(path, "utf8"));
              assert.equal(read("/app/package.json").version, process.env.RELEASE_VERSION);
              const info = read("/app/dist/build-info.json");
              assert.equal(info.version, process.env.RELEASE_VERSION);
              assert.equal(info.commit, process.env.GITHUB_SHA);
              assert.match(execFileSync("node", ["/app/openclaw.mjs", "--version"], { encoding: "utf8" }), new RegExp(process.env.RELEASE_VERSION.replaceAll(".", "\\.")));
              for (const name of ["registerAcpRuntimeBackend", "getAcpRuntimeBackend", "unregisterAcpRuntimeBackend", "tryDispatchAcpReplyHook"]) {
                assert.equal(typeof sdk[name], "function", name);
              }
              console.log("Verified runtime version, source commit, and public ACP backend SDK.");
            '
          node scripts/verify-docker-attestations.mjs --platform "linux/${{ matrix.arch }}" "$IMAGE@$DIGEST"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [identity, build]
    runs-on: ubuntu-24.04
    environment: docker-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Publish and verify version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object | select(.type == "commit") | .sha')" = "$GITHUB_SHA"
          # A public manifest 404 is the only acceptable absent-tag result.
          token="$(curl --fail --silent --show-error 'https://ghcr.io/token?service=ghcr.io&scope=repository:marxbiotech/openclaw:pull' | jq -er .token)"
          status="$(curl --silent --show-error -o "$RUNNER_TEMP/existing-manifest.json" -w '%{http_code}' \
            -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/marxbiotech/openclaw/manifests/$GITHUB_REF_NAME")"
          test "$status" = 404 || { echo "Refusing to overwrite a published or unreadable tag (HTTP $status)." >&2; exit 1; }
          sources=()
          for file in "$RUNNER_TEMP"/digests/*; do
            digest="${file##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          test "${#sources[@]}" = 2
          docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" "${sources[@]}"
          node scripts/verify-docker-attestations.mjs --platform linux/amd64 --platform linux/arm64 "$IMAGE:$GITHUB_REF_NAME"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
