name: OpenClaw NPM Release

on:
  push:
    tags:
      - "mb*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v2026.3.22, mb2026.3.28-beta.1)
        required: true
        type: string
      preflight_only:
        description: Run validation/build only and skip the gated publish job
        required: true
        default: false
        type: boolean

concurrency:
  group: openclaw-npm-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  PNPM_VERSION: "10.23.0"

jobs:
  preflight_openclaw_npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate tag input format
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^(v|mb)[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*((-beta\.[1-9][0-9]*)|(-[1-9][0-9]*))?$ ]]; then
            echo "Invalid release tag format: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Ensure version is not already published
        env:
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "@marxbiotech/openclaw@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            if [[ "${PREFLIGHT_ONLY}" == "true" ]]; then
              echo "@marxbiotech/openclaw@${PACKAGE_VERSION} is already published on npm; continuing because preflight_only=true."
              exit 0
            fi
            echo "@marxbiotech/openclaw@${PACKAGE_VERSION} is already published on npm."
            exit 1
          fi

          echo "Publishing @marxbiotech/openclaw@${PACKAGE_VERSION}"

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Build Control UI
        run: pnpm ui:build

      - name: Sync generated baselines
        run: pnpm plugin-sdk:api:gen && pnpm config:docs:gen

      - name: Validate release tag and package metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_MAIN_REF: origin/marxbiotech/remote-acp
          # Fork release train: CalVer is pinned to the upstream cut date
          OPENCLAW_RELEASE_CALVER_MAX_DAYS: "90"
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-parse HEAD)
          export RELEASE_SHA RELEASE_TAG RELEASE_MAIN_REF
          git fetch --no-tags origin +refs/heads/marxbiotech/remote-acp:refs/remotes/origin/marxbiotech/remote-acp
          pnpm release:openclaw:npm:check

      - name: Verify release contents
        run: pnpm release:check

  validate_publish_dispatch_ref:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.preflight_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require known branch for publish
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" && "${WORKFLOW_REF}" != "refs/heads/marxbiotech/remote-acp" ]]; then
            echo "Real publish runs must be dispatched from main or marxbiotech/remote-acp."
            exit 1
          fi

  publish_openclaw_npm:
    # npm trusted publishing + provenance requires a GitHub-hosted runner.
    needs: [preflight_openclaw_npm, validate_publish_dispatch_ref]
    if: ${{ always() && needs.preflight_openclaw_npm.result == 'success' && (github.event_name == 'push' || needs.validate_publish_dispatch_ref.result == 'success') }}
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate tag input format
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^(v|mb)[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*((-beta\.[1-9][0-9]*)|(-[1-9][0-9]*))?$ ]]; then
            echo "Invalid release tag format: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Ensure version is not already published
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "@marxbiotech/openclaw@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@marxbiotech/openclaw@${PACKAGE_VERSION} is already published on npm."
            exit 1
          fi

          echo "Publishing @marxbiotech/openclaw@${PACKAGE_VERSION}"

      - name: Build
        run: pnpm build

      - name: Build Control UI
        run: pnpm ui:build

      - name: Sync generated baselines
        run: pnpm plugin-sdk:api:gen && pnpm config:docs:gen

      - name: Validate release tag and package metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_MAIN_REF: origin/marxbiotech/remote-acp
          OPENCLAW_RELEASE_CALVER_MAX_DAYS: "90"
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-parse HEAD)
          export RELEASE_SHA RELEASE_TAG RELEASE_MAIN_REF
          git fetch --no-tags origin +refs/heads/marxbiotech/remote-acp:refs/remotes/origin/marxbiotech/remote-acp
          pnpm release:openclaw:npm:check

      - name: Publish
        run: bash scripts/openclaw-npm-publish.sh --publish
